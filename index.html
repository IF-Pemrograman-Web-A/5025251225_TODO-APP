<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>My Todo List</h1>
  </header>

  <main>
    <!-- LEFT PANEL: list of todos -->
    <aside class="panel">
      <h2>Todos</h2>
      <ul class="todo-list">
        <li class="selected">
          <input type="checkbox" checked disabled />
          <span class="done">Finish HTML &amp; CSS layout</span>
        </li>
        <li>
          <input type="checkbox" disabled />
          <span>Design the two-panel grid</span>
        </li>
        <li>
          <input type="checkbox" disabled />
          <span>Make the page responsive</span>
        </li>
        <li>
          <input type="checkbox" disabled />
          <span>Write the new-todo form</span>
        </li>
      </ul>

      <!-- Form component for creating a new Todo -->
      <form>
        <h2>Add Todo</h2>
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Buy groceries" />

        <label for="priority">Priority</label>
        <select id="priority">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>

        <button type="submit">+ Add Todo</button>
      </form>
    </aside>

    <!-- RIGHT PANEL: detail/editor -->
    <section class="panel">
      <h2>Todo Details</h2>
      <label>Title</label>
      <input type="text" value="Finish HTML &amp; CSS layout" readonly />

      <label>Description</label>
      <textarea rows="4" readonly>Build the static Todo List page using semantic HTML and a two-panel layout, styled with an external stylesheet.</textarea>

      <label>Status</label>
      <p class="status">Completed</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 TaskForge</p>
  </footer>

</body>
</html>
